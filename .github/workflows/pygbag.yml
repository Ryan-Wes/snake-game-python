name: Build and Deploy with Pygbag

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Convert audio to OGG
        run: |
          ffmpeg -i assets/sounds/menu_song.mp3 assets/sounds/menu_song.ogg
          ffmpeg -i assets/sounds/game_song.mp3 assets/sounds/game_song.ogg
          ffmpeg -i assets/sounds/eat.wav assets/sounds/eat.ogg
          ffmpeg -i assets/sounds/game_over.wav assets/sounds/game_over.ogg

      - name: Install Pygbag
        run: pip install pygbag

      - name: Build
        run: pygbag --build main.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
